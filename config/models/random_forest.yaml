model:
  name: "RandomForest"
  type: "random_forest"

parameters:
  n_estimators: 100
  max_depth: 10
  min_samples_split: 2
  min_samples_leaf: 1
  random_state: 42

training:
  cross_validation: true
  cv_folds: 5

mlflow:
  log_model: true
  register_model: true
  model_name: "random_forest_iris"
