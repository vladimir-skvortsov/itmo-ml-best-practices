# Gradient Boosting configuration
model:
  name: "GradientBoosting"
  type: "gradient_boosting"

parameters:
  n_estimators: 100
  learning_rate: 0.1
  max_depth: 3
  random_state: 42

training:
  cross_validation: true
  cv_folds: 5

mlflow:
  log_model: true
  register_model: true
  model_name: "gradient_boosting_iris"
