version: "3.8"

services:
  # ClearML API Server
  apiserver:
    image: allegroai/clearml:latest
    container_name: clearml-apiserver
    restart: unless-stopped
    command: apiserver
    ports:
      - "8008:8008"
    environment:
      CLEARML_ELASTIC_SERVICE_HOST: elasticsearch
      CLEARML_ELASTIC_SERVICE_PORT: 9200
      CLEARML_MONGODB_SERVICE_HOST: mongo
      CLEARML_MONGODB_SERVICE_PORT: 27017
      CLEARML_REDIS_SERVICE_HOST: redis
      CLEARML_REDIS_SERVICE_PORT: 6379
      CLEARML_SERVER_DEPLOYMENT_TYPE: linux
    depends_on:
      elasticsearch:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started
      fileserver:
        condition: service_started
    volumes:
      - clearml-logs:/var/log/clearml
      - clearml-config:/opt/clearml/config
      - clearml-fileserver-data:/mnt/fileserver
    networks:
      - backend
      - frontend

  # ClearML Web UI
  webserver:
    image: allegroai/clearml:latest
    container_name: clearml-webserver
    restart: unless-stopped
    command: webserver
    ports:
      - "8080:80"
    depends_on:
      - apiserver
    networks:
      - backend
      - frontend

  # ClearML File Server
  fileserver:
    image: allegroai/clearml:latest
    container_name: clearml-fileserver
    restart: unless-stopped
    command: fileserver
    ports:
      - "8081:8081"
    environment:
      CLEARML__fileserver__delete__allow_batch: "true"
    volumes:
      - clearml-fileserver-data:/mnt/fileserver
      - clearml-logs:/var/log/clearml
      - clearml-config:/opt/clearml/config
    networks:
      - backend
      - frontend

  # MongoDB for ClearML metadata
  mongo:
    image: mongo:7.0
    container_name: clearml-mongo
    restart: unless-stopped
    command: --setParameter internalQueryMaxBlockingSortMemoryUsageBytes=196100200
    volumes:
      - clearml-mongo-data:/data/db
      - clearml-mongo-config:/data/configdb
    networks:
      - backend

  # Elasticsearch for ClearML logs and metrics
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    container_name: clearml-elasticsearch
    restart: unless-stopped
    environment:
      bootstrap.memory_lock: "true"
      cluster.name: clearml
      discovery.type: single-node
      http.compression_level: "7"
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - clearml-elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - backend

  # Redis for ClearML task queues
  redis:
    image: redis:7-alpine
    container_name: clearml-redis
    restart: unless-stopped
    volumes:
      - clearml-redis-data:/data
    networks:
      - backend

  # ClearML Agent
  agent-services:
    image: allegroai/clearml-agent-services:latest
    container_name: clearml-agent-services
    restart: unless-stopped
    privileged: true
    environment:
      CLEARML_API_HOST: http://apiserver:8008
      CLEARML_WEB_HOST: http://webserver:80
      CLEARML_FILES_HOST: http://fileserver:8081
      CLEARML_AGENT_GIT_USER: ${GIT_USER:-}
      CLEARML_AGENT_GIT_PASS: ${GIT_PASS:-}
      CLEARML_WORKER_ID: "clearml-services"
      CLEARML_AGENT_DOCKER_HOST_MOUNT: "/opt/clearml/agent:/root/.clearml"
    depends_on:
      - apiserver
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - clearml-agent-data:/root/.clearml
    networks:
      - backend
    entrypoint: >
      bash -c "curl --retry 10 --retry-delay 10 --retry-connrefused 'http://apiserver:8008/debug.ping' && /usr/agent/entrypoint.sh"

volumes:
  clearml-mongo-data:
  clearml-mongo-config:
  clearml-elasticsearch-data:
  clearml-redis-data:
  clearml-fileserver-data:
  clearml-logs:
  clearml-config:
  clearml-agent-data:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
